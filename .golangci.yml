---
# HISS-04 complexity bounds: cyclomatic complexity <= 10, cognitive <= 15.
version: "2"

linters:
  default: standard
  enable:
    - gocyclo
    - gocognit
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
