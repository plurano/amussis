---
version: 1
repository:
  owner: plurano
  name: amussis
  visibility: private
  description: "Shared Rust crates of the Plurano framework family, kept in one workspace."
  homepage: ""
  topics: []
profiles:
  - framework
facets:
  - security:high
  - api:public-contract
  - agent:sandboxed
  - docs:seo-portal
flavors:
  - name: rust-library
# cargo-mutants exclusions are equivalent mutants: each changes no behaviour,
# with the reason beside it in .cargo/mutants.toml. Category D (120 days).
exceptions:
  - rule: mutants
    path: .cargo/mutants.toml
    category: D
    entered: 2026-10-17
    reason: "category D: two equivalent mutants no test can kill while HashAlgorithm has one variant, each reasoned in the file"
    expires: 2027-02-14
# The editors and agent clients this repository is worked on with. Files of
# any other editor or client are not generated and not tracked.
editors:
  - universal
  - vscode
  - antigravity
agent_clients:
  - claude
  - codex
  - gemini
overrides:
  branch_protection:
    # Owner-approved 2026-10-11: one maintainer and no review bot can approve.
    # Restore independent when a second maintainer or a review bot can.
    review_mode: single_maintainer
    require_extra_approval_for_unattributed_changes: true
register:
  sources:
    expected: 13
    sha256:
      sha256:aab1f460acdcc3304d765472eda2bd31368b6af0a05d2c91dbbd8a1dfda0df3b
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
