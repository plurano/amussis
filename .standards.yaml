---
version: 1
repository:
  owner: plurano
  name: amussis
  visibility: private
  description: "Shared Rust crates of the Plurano framework family, kept in one workspace."
  homepage: ""
  topics: []
profiles:
  - framework
facets:
  - security:high
  - api:public-contract
  - agent:sandboxed
# The engine has no library flavor yet (cordanaLLM/praetor#67); until it
# does, the workspace is audited as rust-systems.
flavors:
  - name: rust-systems
# The editors and agent clients this repository is worked on with. Files of
# any other editor or client are not generated and not tracked.
editors:
  - universal
  - vscode
  - antigravity
agent_clients:
  - claude
  - codex
  - gemini
overrides:
  branch_protection:
    # Owner-approved 2026-10-11: one maintainer and no review bot can approve.
    # Restore independent when a second maintainer or a review bot can.
    review_mode: single_maintainer
register:
  sources:
    expected: 13
    sha256:
      sha256:aab1f460acdcc3304d765472eda2bd31368b6af0a05d2c91dbbd8a1dfda0df3b
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
exceptions:
  - rule: declared-linters
    tool: gocognit
    reason: adoption scaffolds no CI job for gocognit declared by profile "framework"; run it in a workflow, or remove this entry
    expires: "2027-01-11"
  - rule: declared-linters
    tool: gocyclo
    reason: adoption scaffolds no CI job for gocyclo declared by profile "framework"; run it in a workflow, or remove this entry
    expires: "2027-01-11"
  - rule: declared-linters
    tool: golangci-lint
    reason: adoption scaffolds no CI job for golangci-lint declared by profile "framework"; run it in a workflow, or remove this entry
    expires: "2027-01-11"
  - rule: declared-linters
    tool: semgrep
    reason: no semgrep rule set is pinned in this repository and registry rules are fetched at run time, while the gate reaches third-party hosts only in make fetch; the HISS scan of praetorctl audit covers the declared invariants until a pinned rule set and job land
    expires: "2027-01-11"
  - rule: declared-linters
    tool: trivy
    reason: a trivy scan needs a vulnerability database fetched at run time, while the gate reaches third-party hosts only in make fetch; cargo-deny runs licences only, so a pinned vulnerability scan job is open work
    expires: "2027-01-11"
