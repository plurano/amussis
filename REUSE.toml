#
# Only files that cannot carry a header are named here, and the files the
# Praetor engine writes, which it compares byte for byte and so cannot gain
# one. There is deliberately no "**" table: a source file without its own
# header must fail `reuse lint`.

version = 1

[[annotations]]
path = [
    "README.md",
    "Cargo.lock",
    "rustfmt.toml",
    "settings-source.json",
    ".gitignore",
    "bindings/go/go.sum",
    "bindings/go/decision/testdata/v0.1.0-chain.hex",
    "examples/go-consumer/go.sum",
    "tools/notices/refused/Cargo.lock",
    "renovate.json",
    "tools/semgrep/requirements.in",
    "tools/semgrep/requirements.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

# The compiled module holds code of the crates it links and of the Rust
# standard library; the notices beside it name each of them with its licence
# text. `tools/third_party_notices.py check` refuses another expression here.
[[annotations]]
path = [
    "bindings/go/decision/amussis_decision.wasm",
    "bindings/go/decision/THIRD-PARTY-NOTICES.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "2026 Lusoris <lusoris@pm.me>",
    "The Rust Project Contributors",
    "1991-2024 Unicode, Inc.",
    "The authors named in bindings/go/decision/THIRD-PARTY-NOTICES.txt",
]
SPDX-License-Identifier = "EUPL-1.2 AND MIT AND Unicode-3.0"

# The standard library part of those notices, as the pinned toolchain's own
# notice documents give it.
[[annotations]]
path = ["tools/notices/standard-library-*.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = [
    "The Rust Project Contributors",
    "1991-2024 Unicode, Inc.",
    "2014 Alex Crichton",
]
SPDX-License-Identifier = "MIT AND Unicode-3.0"

# Written by `praetorctl adopt` and held in step by `praetorctl audit`.
# "closest" keeps the terms a generated file states itself, as the bundled
# skills do.
[[annotations]]
path = [
    ".agents/**",
    ".claude/**",
    ".codex/**",
    ".config/**",
    ".devcontainer/**",
    ".gemini/**",
    ".github/rulesets/**",
    ".github/actionlint.yaml",
    ".github/pull_request_template.md",
    ".github/workflows/praetor-api.yml",
    ".github/workflows/praetor-docs.yml",
    ".github/workflows/reuse.yml",
    ".paperclip/**",
    ".vscode/**",
    "docs/adr/**",
    ".editorconfig",
    ".gitattributes",
    ".standards-baseline.json",
    ".standards.lock",
    ".standards.yaml",
    "AGENTS.md",
    "AGENTS.readonly.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "lefthook.yml",
    "tools/figures/**",
    "tools/markdownlint/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Lusoris <lusoris@pm.me>"
SPDX-License-Identifier = "EUPL-1.2"

# The figure tools vendor interfig, and the committed player bundles it with
# React, react-dom and scheduler; dist/THIRD-PARTY-LICENSES.txt carries their
# MIT texts. Both tables mirror the engine's own REUSE.toml and must stay after
# the table above: when several tables match a file, the last one decides.
[[annotations]]
path = ["tools/figures/third_party/interfig/upstream/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Vectorize AI, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["tools/figures/dist/**"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Lusoris <lusoris@proton.me>",
    "2025 Vectorize AI, Inc.",
    "Meta Platforms, Inc. and affiliates",
]
SPDX-License-Identifier = "EUPL-1.2 AND MIT"
