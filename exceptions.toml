#
# The exceptions of this workspace to its own rules, for rules the Praetor
# engine's list in .standards.yaml does not read. The shape is the engine's:
# one rule, one file, a reason, and the day the exception ends, at most 90 days
# ahead. An entry past its day excuses nothing. tools/exceptions_check.py
# accepts an advisories list only for the vulnerability rule and
# reads this list in `make verify`. The list moves into .standards.yaml once
# the engine accepts repository-declared rules (cordanaLLM/praetor#1206).

[[exception]]
rule = "unsafe_code"
path = "crates/amussis-decision-wasm/src/abi.rs"
reason = "a WebAssembly module declares its imports in an unsafe extern block and names its exports with #[unsafe(no_mangle)]; Rust has no safe spelling for either, and the file holds no unsafe block and dereferences no raw pointer"
expires = "2027-01-09"

[[exception]]
rule = "vulnerability"
path = "tools/semgrep/requirements.txt"
advisories = ["CVE-2026-116684", "CVE-2026-116685", "CVE-2026-116686", "CVE-2026-59951", "CVE-2026-114603", "CVE-2026-126360"]
reason = "semgrep 1.182.1 and 1.185.0 pin mcp==1.29.0 and opentelemetry-api~=1.37.0, preventing a lockable fix; the gate runs only offline semgrep scan, with no MCP server, inbound HTTP or traceparent parsing, so the vulnerable code is not in the execution path; MEL C, 10 days"
expires = "2026-11-27"

[[exception]]
rule = "ruff"
path = ".config/lefthook/scripts/common.py"
codes = ["S603", "S607"]
reason = "engine-rendered hook runner held byte-equal to the pinned engine source; it starts argv lists without a shell from fixed executable names; the finding goes to the engine; MEL C, 10 days"
expires = "2026-11-27"

[[exception]]
rule = "private-id"
path = "tools/message_ids.py"
commits = ["00f77393a3a49f0fe79420067b86481324f55866", "7de163a9c0971926771197c8fde0d2ff069740a7"]
expires = "2027-02-15"
reason = "two squash bodies on main name plan ids; rewriting main history would force-push the protected branch, so they stay; MEL D (120 days), held to this list's 90-day cap"
