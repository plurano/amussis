# The member list is written out, never globbed: a directory under crates/
# joins the workspace by a reviewed line here, not by gaining a manifest.
[workspace]
resolver = "3"
members = [
    "crates/amussis-decision",
    "crates/amussis-decision-wasm",
    "tools/module-compare",
]

# edition, rust-version and the two lint tables below are settings shared with
# the source repository; tools/settings_sync.py holds them to the record in
# settings-source.json.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "EUPL-1.2"
repository = "https://github.com/plurano/amussis"
authors = ["Lusoris <lusoris@pm.me>"]

[workspace.dependencies]
base16ct = { version = "1.0.0", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
wasmparser = { version = "=0.261.0", default-features = false, features = ["std"] }

# The WebAssembly module of crates/amussis-decision-wasm. Size is not the aim:
# one codegen unit and link-time optimisation make the build reproducible
# enough to compare the committed module byte for byte, and abort keeps a
# panic from unwinding into the host.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
too_many_lines = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
