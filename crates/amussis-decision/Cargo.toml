[package]
name = "amussis-decision"
description = "Decision engine: risk tiers, maker-checker oversight and a hash-linked audit ledger."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/amussis-decision"
homepage = "https://github.com/plurano/amussis"
keywords = ["decision-engine", "audit", "governance", "ledger", "maker-checker"]
categories = ["algorithms", "data-structures"]
publish = true

[lib]
path = "src/lib.rs"

[dependencies]
base16ct.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
# The JSON Lines ledger renderer. It stays behind a feature because it is a
# local operator convenience, not a schema a consumer may rely on; the
# proposal schema and the encoding rules are unconditional.
jsonl = []

[lints]
workspace = true
