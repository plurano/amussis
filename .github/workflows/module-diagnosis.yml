---
# Module diagnosis: builds the WebAssembly module on Linux, macOS and Windows
# the way the gate builds it and keeps cargo's record of every compiler call,
# so the three hosts can be compared argument by argument. A Windows host
# builds other bytes than the committed module (issue 2); a run of this found
# the cause, and the workflow stays for the fix. It is started by hand, it
# gates nothing, and it goes when that issue is closed.
name: Module diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

# One shell on every platform, as in the verification gate.
defaults:
  run:
    shell: bash

jobs:
  # Three jobs run one list of steps, written once under the first job; each
  # carries a fixed name, as the check of the required names reads only those.
  record:
    name: Module record (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: &record
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same step as the verification gate: with no toolchain argument rustup
      # installs the channel rust-toolchain.toml pins, and the WebAssembly
      # target is added and checked in a step of its own.
      - name: Materialise the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
          rustup target list --installed | grep -qx wasm32-unknown-unknown

      # The module tool builds without the network, as the gate does.
      - name: Fetch the locked crates
        run: cargo fetch --locked

      # The checkout is fresh, so every crate is compiled and recorded. On a
      # Windows host the check passes on its dated exception and still builds.
      - name: Build the module and record every compiler call
        run: |
          mkdir record
          rustc -vV > record/rustc.txt
          cargo -vV > record/cargo.txt
          python3 -B tools/wasm_module.py check --cargo-log record/cargo-build.log
          cp target/wasm32-unknown-unknown/wasm/amussis_decision_wasm.wasm record/

      - name: Keep the record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-record-${{ runner.os }}
          path: record/
          if-no-files-found: error
          retention-days: 30

  record-macos:
    name: Module record (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps: *record

  record-windows:
    name: Module record (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps: *record
