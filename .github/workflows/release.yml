---
# Release: a version tag builds the release files in the release builder,
# reads them back the way a consumer does, and stores them in a draft release
# on the forge. A person publishes the draft; nothing here publishes to a
# package registry. A tag with a hyphen after the version (`v0.1.0-rc.1`) runs
# the same path and marks its draft as a pre-release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the release files
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  # Reads the files back the way a stranger does, with the shared read-back of
  # plurano/horistes (tools/readback.py, ADR-0033 there): no credentials, the
  # files of the build job from a local folder, before the draft exists. Every
  # check is asked again with one expectation changed and has to be refused.
  # The last step plants a changed file and requires the tool to fail on it.
  verify:
    name: Read the release files back
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      READBACK: horistes/tools/readback.py
      PARAMS: .github/release-readback.toml
    steps:
      - name: Check out the parameter file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-readback.toml
          sparse-checkout-cone-mode: false

      - name: Check out the shared read-back
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: plurano/horistes
          ref: 7bd2c439f559324a3fef0d6cdd742436c1963219
          path: horistes
          persist-credentials: false
          sparse-checkout: tools
          sparse-checkout-cone-mode: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Read the files back
        env:
          TAG: ${{ github.ref_name }}
        run: python3 -I "$READBACK" verify --params "$PARAMS" --tag "$TAG" --local dist --work "$RUNNER_TEMP/readback"

      - name: A changed file is refused
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp -r dist planted
          read -r _ name < dist/checksums.txt
          printf 'planted\n' >> "planted/${name}"
          code=0
          python3 -I "$READBACK" verify --params "$PARAMS" --tag "$TAG" --local planted --work "$RUNNER_TEMP/planted" || code=$?
          if [ "$code" -ne 1 ]; then
            echo "FAIL: the read-back gave exit code ${code} for a changed ${name}, not 1" >&2
            exit 1
          fi

  draft:
    name: Store the files in a draft release
    needs: [build, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --generate-notes)
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${flags[@]}" dist/*
