---
# Release: a version tag builds the release files in the release builder,
# reads them back the way a consumer does, and stores them in a draft release
# on the forge. A person publishes the draft; nothing here publishes to a
# package registry. A tag with a hyphen after the version (`v0.1.0-rc.1`) runs
# the same path and marks its draft as a pre-release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the release files
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  # Reads the files back without the builder's rights. Each check runs twice:
  # on the file as built, which has to pass, and on a copy with one planted
  # defect, which has to be refused. A check that accepts its plant fails the
  # release.
  verify:
    name: Read the release files back
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILDER: ${{ github.repository }}/.github/workflows/release-build.yml
      SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-build.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Every file matches its checksum
        working-directory: dist
        run: sha256sum --check --strict checksums.txt

      - name: The checksums are signed by the release builder
        run: |
          cosign verify-blob \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: Changed checksums are refused
        run: |
          cp dist/checksums.txt planted-checksums.txt
          printf 'planted\n' >> planted-checksums.txt
          if cosign verify-blob \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer "$ISSUER" \
            --bundle dist/checksums.txt.sigstore.json \
            planted-checksums.txt; then
            echo "FAIL: changed checksums passed the signature check" >&2
            exit 1
          fi

      - name: A signature by another workflow is refused
        run: |
          if cosign verify-blob \
            --certificate-identity "${SIGNER/release-build.yml/release.yml}" \
            --certificate-oidc-issuer "$ISSUER" \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt; then
            echo "FAIL: the signature passed for a workflow that did not sign" >&2
            exit 1
          fi

      - name: Every file carries provenance from the release builder
        run: |
          while read -r _ name; do
            gh attestation verify "dist/${name}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$BUILDER" \
              --source-ref "$GITHUB_REF"
          done < dist/checksums.txt

      - name: A changed file carries no provenance
        run: |
          read -r _ name < dist/checksums.txt
          cp "dist/${name}" planted-file
          printf 'planted\n' >> planted-file
          if gh attestation verify planted-file \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$BUILDER" \
            --source-ref "$GITHUB_REF"; then
            echo "FAIL: a changed file passed the provenance check" >&2
            exit 1
          fi

  draft:
    name: Store the files in a draft release
    needs: [build, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --generate-notes)
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${flags[@]}" dist/*
