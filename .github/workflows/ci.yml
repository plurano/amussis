---
# Verification gate: runs `make verify-all`, the same target a contributor runs
# locally, on the toolchain rust-toolchain.toml pins and with the engine built
# from the pinned Praetor commit. Three jobs run it, on Linux, macOS and
# Windows; each is a required check under its own fixed name, and all three
# run one list of steps, written once under the first job.
name: Verification gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  REUSE_VERSION: "6.2.0"
  # cargo-deny runs the licence allow-list of the gate. Each digest is the one
  # its release page publishes for that platform's archive of this version.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256_LINUX: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  CARGO_DENY_SHA256_MACOS: "fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3"
  CARGO_DENY_SHA256_WINDOWS: "975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc"
  # cargo-semver-checks holds the public Rust API to the last release tag:
  # a breaking change fails until the workspace version says it is one. Each
  # digest is the one its release publishes for that platform's archive of
  # this version.
  CARGO_SEMVER_CHECKS_VERSION: "0.51.0"
  CARGO_SEMVER_CHECKS_SHA256_LINUX: "396c8508d973c83de52660943a057e971b586f7511c3ba695762373452b43d5b"
  CARGO_SEMVER_CHECKS_SHA256_MACOS: "3cec5da41eee9a3336d75ad43d1f30a5c9680818f4ba209024786f452cabab5b"
  CARGO_SEMVER_CHECKS_SHA256_WINDOWS: "9bd49e09c7487c323a9f4479c5d2b0b50d29a45662ba28344b7a0f5423eb0444"
  # gitleaks scans the history for credentials (HISS-12). Each digest is the
  # one its release publishes for that platform's archive of this version.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  GITLEAKS_SHA256_MACOS: "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
  GITLEAKS_SHA256_WINDOWS: "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
  # golangci-lint lints the Go binding and examples (HISS-04). Each digest is
  # the one its release publishes for that platform's archive of this version.
  GOLANGCI_LINT_VERSION: "2.14.0"
  GOLANGCI_LINT_SHA256_LINUX: "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab"
  GOLANGCI_LINT_SHA256_MACOS: "5ef5f36a7147e91dc58ef9ef4d11bb7bad5ead0c76eb6c01327a73c641d1dcc3"
  GOLANGCI_LINT_SHA256_WINDOWS: "b15f903d1649283a2ab6e8d2f0c317eaf1f9f6b3763950e7e8b7e72a43dd724f"
  # trivy scans dependencies offline for vulnerabilities (HISS-11). Each
  # digest is the one its release publishes for that platform's archive of this
  # version.
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256_LINUX: "e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7"
  TRIVY_SHA256_MACOS: "e7ec0d21fe842553f59af99aba2efbcc822369fbaed27019c575408b6d135fce"
  TRIVY_SHA256_WINDOWS: "7b4762a5a5326cb4b83dfd2bb5d9aaf15a1ed867c75cad7dd8b38840a28e7be6"
  # Published Praetor commit that builds the praetorctl this gate pins. The
  # Git hooks read the same declaration (.config/lefthook/engine.sh), so a
  # commit is judged locally by the engine that judges it here.
  PRAETOR_REF: "32a35c8fb947b449ff46ae0a3b32017b409dccad"
  # cargo-mutants tests the tests: it changes the code a pull request
  # touches and expects a test to fail. The digest is the one its release
  # publishes for the Linux archive of this version.
  CARGO_MUTANTS_VERSION: "27.1.0"
  CARGO_MUTANTS_SHA256_LINUX: "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e"
  CARGO_TERM_COLOR: never

# One shell on every platform: the steps are written for bash, which the
# Windows runner image carries too.
defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps: &gate
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Full history: the sign-off step reads every commit of the pull request.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Praetor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cordanaLLM/praetor
          ref: ${{ env.PRAETOR_REF }}
          path: praetor-src
          persist-credentials: false

      - name: Set up the Go toolchain declared by Praetor
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: praetor-src/go.mod
          cache: false

      # The checkpoint hook scripts come from this engine commit; they have to
      # equal its source and pass its tests. One platform runs it: the
      # comparison reads the same committed bytes on every runner.
      - name: Hook scripts equal the pinned engine and pass its tests
        if: runner.os == 'Linux'
        run: make verify-hook-scripts PRAETOR_SRC=praetor-src

      - name: Build pinned praetorctl from the published Praetor commit
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          test "$(git -C praetor-src rev-parse HEAD)" = "$PRAETOR_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          # go vet first: the Go compiler has no warnings, so vet is the
          # warnings-as-errors form for the one Go build this gate runs.
          ( cd praetor-src && go mod download && go mod verify \
            && go vet ./... \
            && go build -trimpath -buildvcs=false \
              -o "$RUNNER_TEMP/bin/praetorctl$(go env GOEXE)" ./cmd/standardsctl )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # The Praetor checkout is a build input only; the audit and the
          # licence check must not read it as content of this repository.
          rm -rf praetor-src

      # The runner image ships a Rust toolchain, but not the pinned one. With
      # no toolchain argument rustup installs the active toolchain, which
      # rust-toolchain.toml overrides to the pinned channel. That form takes
      # the components from the file and ignores a target given on the
      # command line, so the WebAssembly target is added in a step of its own
      # and its presence is checked here, before the gate needs it.
      - name: Materialise the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update --profile minimal \
            -c rustfmt,clippy
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
          rustup which cargo-clippy
          rustup target list --installed | grep -qx wasm32-unknown-unknown

      # The archive of this runner's platform, held to its pinned digest: a
      # changed archive fails the comparison and nothing of it is unpacked. A
      # platform without a pinned archive stops here instead of running an
      # unpinned one. The paths are relative because a drive letter in a path
      # reads as a host name to tar.
      - name: Install the pinned cargo-deny
        run: |
          exe=""
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) target=x86_64-unknown-linux-musl; want="$CARGO_DENY_SHA256_LINUX" ;;
            macOS-ARM64) target=aarch64-apple-darwin; want="$CARGO_DENY_SHA256_MACOS" ;;
            Windows-X64) target=x86_64-pc-windows-msvc; want="$CARGO_DENY_SHA256_WINDOWS"; exe=.exe ;;
            *) echo "::error::no cargo-deny archive is pinned for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          archive="cargo-deny-${CARGO_DENY_VERSION}-${target}"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "${archive}.tar.gz" \
            "${base}/${CARGO_DENY_VERSION}/${archive}.tar.gz"
          got="$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${archive}.tar.gz")"
          if [ "$got" != "$want" ]; then
            echo "::error::${archive}.tar.gz has sha256 ${got}, not the pinned ${want}"
            exit 1
          fi
          tar -xzf "${archive}.tar.gz" "${archive}/cargo-deny${exe}"
          install -m 0755 "${archive}/cargo-deny${exe}" "bin/cargo-deny${exe}"
          cargo deny --version

      # The same rule for cargo-semver-checks; its archive holds the binary at
      # the top level.
      - name: Install the pinned cargo-semver-checks
        run: |
          exe=""
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) target=x86_64-unknown-linux-musl; want="$CARGO_SEMVER_CHECKS_SHA256_LINUX" ;;
            macOS-ARM64) target=aarch64-apple-darwin; want="$CARGO_SEMVER_CHECKS_SHA256_MACOS" ;;
            Windows-X64) target=x86_64-pc-windows-msvc; want="$CARGO_SEMVER_CHECKS_SHA256_WINDOWS"; exe=.exe ;;
            *) echo "::error::no cargo-semver-checks archive is pinned for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          archive="cargo-semver-checks-${target}.tar.gz"
          base="https://github.com/obi1kenobi/cargo-semver-checks/releases/download"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "${archive}" "${base}/v${CARGO_SEMVER_CHECKS_VERSION}/${archive}"
          got="$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${archive}")"
          if [ "$got" != "$want" ]; then
            echo "::error::${archive} has sha256 ${got}, not the pinned ${want}"
            exit 1
          fi
          mkdir semver-checks-unpacked
          tar -xzf "${archive}" -C semver-checks-unpacked "cargo-semver-checks${exe}"
          install -m 0755 "semver-checks-unpacked/cargo-semver-checks${exe}" "bin/cargo-semver-checks${exe}"
          cargo semver-checks --version

      # The same rule for gitleaks: the archive is held to its pinned digest
      # before anything of it is unpacked. The Windows archive is a zip, which
      # Python unpacks on every host.
      - name: Install the pinned gitleaks
        run: |
          exe=""
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=linux_x64; kind=tar.gz; want="$GITLEAKS_SHA256_LINUX" ;;
            macOS-ARM64) platform=darwin_arm64; kind=tar.gz; want="$GITLEAKS_SHA256_MACOS" ;;
            Windows-X64) platform=windows_x64; kind=zip; want="$GITLEAKS_SHA256_WINDOWS"; exe=.exe ;;
            *) echo "::error::no gitleaks archive is pinned for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          archive="gitleaks_${GITLEAKS_VERSION}_${platform}.${kind}"
          base="https://github.com/gitleaks/gitleaks/releases/download"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "${archive}" "${base}/v${GITLEAKS_VERSION}/${archive}"
          got="$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${archive}")"
          if [ "$got" != "$want" ]; then
            echo "::error::${archive} has sha256 ${got}, not the pinned ${want}"
            exit 1
          fi
          mkdir gitleaks-unpacked
          python3 -c 'import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])' "${archive}" gitleaks-unpacked
          install -m 0755 "gitleaks-unpacked/gitleaks${exe}" "bin/gitleaks${exe}"
          gitleaks version

      # The same rule for golangci-lint: the archive is held to its pinned digest
      # before anything of it is unpacked.
      - name: Install the pinned golangci-lint
        run: |
          exe=""
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=linux-amd64; kind=tar.gz; want="$GOLANGCI_LINT_SHA256_LINUX" ;;
            macOS-ARM64) platform=darwin-arm64; kind=tar.gz; want="$GOLANGCI_LINT_SHA256_MACOS" ;;
            Windows-X64) platform=windows-amd64; kind=zip; want="$GOLANGCI_LINT_SHA256_WINDOWS"; exe=.exe ;;
            *) echo "::error::no golangci-lint archive is pinned for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-${platform}.${kind}"
          base="https://github.com/golangci/golangci-lint/releases/download"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "${archive}" "${base}/v${GOLANGCI_LINT_VERSION}/${archive}"
          got="$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${archive}")"
          if [ "$got" != "$want" ]; then
            echo "::error::${archive} has sha256 ${got}, not the pinned ${want}"
            exit 1
          fi
          mkdir golangci-lint-unpacked
          python3 -c 'import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])' "${archive}" golangci-lint-unpacked
          install -m 0755 "golangci-lint-unpacked/golangci-lint-${GOLANGCI_LINT_VERSION}-${platform}/golangci-lint${exe}" "bin/golangci-lint${exe}"
          golangci-lint version

      # The same rule for trivy: the archive is held to its pinned digest
      # before anything of it is unpacked.
      - name: Install the pinned trivy
        run: |
          exe=""
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) platform=Linux-64bit; kind=tar.gz; want="$TRIVY_SHA256_LINUX" ;;
            macOS-ARM64) platform=macOS-ARM64; kind=tar.gz; want="$TRIVY_SHA256_MACOS" ;;
            Windows-X64) platform=windows-64bit; kind=zip; want="$TRIVY_SHA256_WINDOWS"; exe=.exe ;;
            *) echo "::error::no trivy archive is pinned for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          archive="trivy_${TRIVY_VERSION}_${platform}.${kind}"
          base="https://github.com/aquasecurity/trivy/releases/download"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 \
            --output "${archive}" "${base}/v${TRIVY_VERSION}/${archive}"
          got="$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "${archive}")"
          if [ "$got" != "$want" ]; then
            echo "::error::${archive} has sha256 ${got}, not the pinned ${want}"
            exit 1
          fi
          mkdir trivy-unpacked
          python3 -c 'import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])' "${archive}" trivy-unpacked
          install -m 0755 "trivy-unpacked/trivy${exe}" "bin/trivy${exe}"
          trivy --version

      # semgrep's hashed wheels are locked for Python 3.14. The interpreter
      # only builds semgrep's venv; the gate keeps the runner's python3.
      - id: semgrep-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          update-environment: false

      - name: Install semgrep
        env:
          SEMGREP_PYTHON: ${{ steps.semgrep-python.outputs.python-path }}
        run: |
          "$SEMGREP_PYTHON" -m venv "$RUNNER_TEMP/semgrep"
          case "$RUNNER_OS" in
            Windows) bin="$RUNNER_TEMP/semgrep/Scripts" ;;
            *) bin="$RUNNER_TEMP/semgrep/bin" ;;
          esac
          "$bin/pip" install --require-hashes --no-deps -r tools/semgrep/requirements.txt
          # A --no-deps install skips the resolver; check that locked pins satisfy bounds.
          "$bin/pip" check
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/semgrep" --version

      # The documentation gate runs on Node.js; its packages come from the npm
      # cache that `make fetch` fills, so the action keeps no cache of its own.
      - name: Set up Node.js for the documentation gate
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # The log names the host and the tools the gate is about to run.
      - name: Name the tools the gate will run
        run: |
          uname -a
          command -v make sh python3 go cargo rustup pipx praetorctl cargo-deny cargo-semver-checks gitleaks golangci-lint semgrep trivy node npm
          make --version | head -1
          python3 --version
          semgrep --version
          trivy --version | head -1
          node --version

      - name: Verification gate
        run: make verify-all REUSE="pipx run --spec reuse[charset-normalizer]==${REUSE_VERSION} reuse"

      # The gate ran this check's selftest (make verify-signoff) above.
      - name: Sign-off on pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B tools/signoff_check.py check --base "$BASE_SHA" --head "$HEAD_SHA"

      # The gate holds the settings to their record; this step also holds the
      # record to the source repository's main branch whenever a pull request
      # changes a settings file or the record, so such a change cannot merge
      # out of step with the source. The weekly settings-drift workflow covers
      # changes made in the source. A red run is cured by
      # `tools/settings_sync.py update --source`. One platform is enough: the
      # comparison reads files, not the platform.
      - name: Settings equal the source when a pull request changes them
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_URL: https://github.com/cordanaLLM/Aegis-OS.git
        run: |
          touched="$(python3 -B tools/settings_sync.py changed --base "$BASE_SHA" --head "$HEAD_SHA")"
          if [ -z "$touched" ]; then
            echo "No settings file changed; the weekly settings-drift workflow holds them to the source."
            exit 0
          fi
          printf 'Changed settings files:\n%s\n' "$touched"
          timeout 120 git clone --quiet --depth 1 "$SOURCE_URL" "$RUNNER_TEMP/settings-source"
          python3 -B tools/settings_sync.py check --source "$RUNNER_TEMP/settings-source"

      # The API compatibility gate of the Go API workflow has to refuse a
      # removed exported method. It builds the gate's checker from the Go
      # module proxy with the toolchain that workflow lets Go select, so it
      # runs here and not in the offline gate; one platform is enough, as the
      # workflow itself runs on Linux only.
      - name: Planted API break
        if: runner.os == 'Linux'
        env:
          GOTOOLCHAIN: auto
        run: make verify-api-plant

  verify-macos:
    name: Verification gate (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps: *gate

  verify-windows:
    name: Verification gate (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    steps: *gate

  # Not a required check: it reports mutants the tests miss in the changed
  # Rust code of a pull request. A missed mutant fails the job, which shows
  # on the pull request without blocking the merge. Like the gate, it fails a
  # draft in its first step rather than skipping it in the job condition: a
  # skipped job reports success.
  mutants:
    name: Mutation testing (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialise the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup show active-toolchain

      - name: Install cargo-mutants
        run: |
          archive=cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --max-time 120 -o "$archive" \
            "https://github.com/sourcefrog/cargo-mutants/releases/download/v${CARGO_MUTANTS_VERSION}/${archive}"
          echo "${CARGO_MUTANTS_SHA256_LINUX}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" cargo-mutants
          rm "$archive"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The manifest tests read `cargo metadata --offline`, which needs every
      # package of the lock file in the cargo home, not only the ones a build
      # of the workspace downloads.
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked

      - name: Mutate the changed code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cargo mutants --version
          git diff "$BASE_SHA...$HEAD_SHA" -- '*.rs' > "$RUNNER_TEMP/pr.diff"
          if [ ! -s "$RUNNER_TEMP/pr.diff" ]; then
            echo "No Rust change; nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --timeout 300 \
            --all-features --cargo-arg=--locked -o "$RUNNER_TEMP"

      - name: Summarise missed mutants
        if: always()
        run: |
          out="$RUNNER_TEMP/mutants.out"
          [ -d "$out" ] || exit 0
          for kind in caught missed timeout unviable; do
            printf '%s: %s\n' "$kind" "$(wc -l < "$out/$kind.txt")"
          done >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$out/missed.txt" ]; then
            { echo '```'; cat "$out/missed.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
