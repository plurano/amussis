---
# Publish: publishing a GitHub release publishes the crates to crates.io and
# tags the Go module. release.yml builds the release and stores it as a draft;
# when a maintainer publishes the draft, this workflow runs. Pre-releases
# are skipped: an rc must not land on crates.io for good. A manual run
# (workflow_dispatch) from a release tag only exchanges the OIDC token and
# publishes nothing; it proves the trusted publisher between releases.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  crates:
    name: Publish crates to crates.io
    # Skip pre-releases: an rc must not land on crates.io for good (crates.io
    # releases are immutable and permanent). The event is named: on a manual
    # run github.event.release is empty, and the negation alone would pass.
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      # Trusted publishing: crates.io exchanges the job's OIDC token for a
      # publish token bound to this workflow and environment.
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      # Same step as release-build.yml: with no toolchain argument rustup
      # installs the channel rust-toolchain.toml pins, and the WebAssembly
      # target is added and checked in a step of its own.
      - name: Materialise the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup show active-toolchain
          rustup target list --installed | grep -qx wasm32-unknown-unknown

      - name: Verify release tag matches workspace version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ws_version="$(cargo metadata --no-deps --format-version 1 --locked | python3 -I -c 'import sys, json; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "amussis-decision"))')"
          if [ "$TAG" != "v${ws_version}" ]; then
            echo "FAIL: release tag ${TAG} does not match expected version v${ws_version}" >&2
            exit 1
          fi
          echo "PASS: release tag ${TAG} matches workspace version v${ws_version}"

      # Trusted publishing (https://crates.io/docs/trusted-publishing): each
      # crate trusts workflow publish.yml in environment crates-io. The action
      # returns a token that expires within 30 minutes, and its post step
      # revokes it when the job ends. No stored token remains to fall back on.
      - name: Exchange the OIDC token for a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          cargo publish --locked -p amussis-decision -p amussis-decision-wasm

  # Tags the Go module at the release commit. The tag name pattern
  # (bindings/go/v*) does not match release.yml's `v*`, so it starts no
  # release run.
  go-module:
    name: Tag the Go module
    needs: [crates]
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Tag the Go module at the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          commit_sha="$(gh api "repos/${GH_REPO}/commits/${TAG}" -q .sha)"
          gh api "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/bindings/go/${TAG}" \
            -f "sha=${commit_sha}"
          tag_ref="$(gh api "repos/${GH_REPO}/git/ref/tags/bindings/go/${TAG}" -q .ref)"
          if [ "$tag_ref" != "refs/tags/bindings/go/${TAG}" ]; then
            echo "FAIL: tag refs/tags/bindings/go/${TAG} was not verified" >&2
            exit 1
          fi
          echo "PASS: verified tag ${tag_ref} at ${commit_sha}"

  # Manual run: the same environment and the same trusted publisher as the
  # crates job, without a publish. The environment admits release tags only
  # (deployment policy v*), so the run is started on a tag. The action's post
  # step revokes the token when the job ends.
  token-exchange:
    name: Exchange the OIDC token without publishing
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange the OIDC token for a crates.io token
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Require a token from the exchange
        env:
          TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "FAIL: crates.io returned no token" >&2
            exit 1
          fi
          echo "PASS: crates.io exchanged the OIDC token of ${GITHUB_WORKFLOW_REF} (environment crates-io)"
